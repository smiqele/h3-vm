hypotheses:
  - id: HYP-001
    title: Смысловая группировка данных в таблице ресурсов
    status: ready-for-test
    owner: Продуктовый дизайн

    job:
      actor: Пользователь облачной платформы
      context: Просматривает список виртуальных машин и сравнивает несколько ресурсов
      need: Быстро обнаружить ресурс, который требует внимания, и понять причину
      outcome: Оценить состояние инфраструктуры без последовательного изучения каждой строки

    observation: >
      Широкая таблица хорошо поддерживает сравнение, но разрастается до большого
      количества колонок и требует горизонтального скролла. Карточка хорошо
      структурирует один ресурс, но затрудняет сканирование потока ресурсов.

    statement: >
      Если объединить сравнительную структуру таблицы со смысловой группировкой
      данных внутри ячеек, пользователь будет быстрее считывать состояние нескольких
      ресурсов и реже обращаться к настройке колонок и горизонтальному скроллу.

    solution:
      summary: >
        Сгруппировать состояние, идентификацию, ресурсы и сеть в несколько доменных
        колонок, сохранив строки как основную единицу сравнения.
      patterns:
        - pattern.resource-list
      screens:
        - screen.compute.vm.list

    evaluation:
      quantitative:
        - metric: Время поиска проблемного ресурса
          target: На 20% меньше относительно полной таблицы
          method: Сравнительный usability-тест
        - metric: Точность определения причины предупреждения
          target: Не менее 90% успешных ответов
          method: Задание на диагностику списка из 5–10 ресурсов
        - metric: Горизонтальный скролл
          target: Используется реже, чем в полной таблице
          method: События интерфейса и запись сессии
      qualitative:
        - signal: Пользователь понимает принцип группировки без объяснения
          method: Наблюдение и пересказ структуры своими словами
        - signal: Пользователь уверенно сравнивает 5–10 ресурсов
          method: Интервью после выполнения задания
        - signal: В ячейках не воспринимается слишком много информации
          method: Оценка сложности и открытый комментарий

    evidence: []
    decision:
      state: pending
      rationale: Данных для решения пока нет
      decidedAt: null
    tasks: []
